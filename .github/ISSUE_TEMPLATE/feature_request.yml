name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        TermiPaw deliberately stays small. Please check docs/ROADMAP.md first: it lists planned features and features that are not planned.
        Requests may be written in English or Chinese.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task or problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How could TermiPaw help?
  - type: textarea
    id: alternatives
    attributes:
      label: How do you do it today?
      description: Other tools or workarounds you use.
